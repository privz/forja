name: ForjaLab
options:
  bundleIdPrefix: com.privz.forja
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  ForjaLab:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privz.forja.lab
        PRODUCT_NAME: ForjaLab
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Forja Lab
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.privz.forja.lab
            CFBundleURLSchemes: [forja-lab]
    entitlements:
      path: App/ForjaLab.entitlements
      properties:
        com.apple.security.application-groups: [group.com.privz.forja.lab]
    dependencies:
      - target: ForjaLabWidget
        embed: true
    scheme:
      gatherCoverageData: false
  ForjaLabWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privz.forja.lab.widget
        PRODUCT_NAME: ForjaLabWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Forja Lab Widget
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ForjaLabWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.privz.forja.lab]
